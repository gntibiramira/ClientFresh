            logDiv.innerHTML += `${new Date().toLocaleTimeString()}: ${message}<br>`;
            console.log(message);
        }

        // Test Firebase connection
        async function testConnection() {
            log("Testing Firebase connection...");
            try {
                const testDoc = await db.collection('test').doc('connection-test').get();
                log("✅ Firebase connection successful!");
            } catch (error) {
                log("❌ Firebase connection failed: " + error.message);
            }
        }

        // Import products
        async function importProducts() {
            log("Starting product import...");
            
            if (!products || products.length === 0) {
                log("❌ No products to import!");
                return;
            }

            log(`Found ${products.length} products to import`);

            for (const product of products) {
                try {
                    log(`Importing: ${product.title}...`);
                    await db.collection('products').add({
                        ...product,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    log(`✅ Success: ${product.title}`);
                } catch (error) {
                    log(`❌ Error importing ${product.title}: ${error.message}`);
                }
            }
            log("Import process completed!");
        }

        log("Page loaded. Click 'Test Firebase Connection' first.");
    </script>
</body>
</html>
